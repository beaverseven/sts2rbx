<title>Gloomfen Rumble</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1b1f4a">
<meta name="description" content="Gloomfen Rumble: an original twilight-bog 3D platformer starring Morel, a morel-mushroom sprite.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Grandstander:wght@500;700;800&display=swap">
<style>
/* ==========================================================================
   Gloomfen Rumble UI. One deliberate dark twilight look; every colour is a
   token taken from the ARCHITECTURE.md palette (plus a few named extras that
   core's materials palette also uses).
   ========================================================================== */
:root {
  color-scheme: dark;
  /* palette (ARCHITECTURE.md "Visual direction") */
  --sky-top: #1b1f4a;
  --sky-mid: #2c6d74;
  --horizon: #f2a65a;
  --moss: #7fae4e;
  --moss-dark: #3f6b3a;
  --bark: #5a3e2b;
  --bog: #1f3b33;
  --glow-cyan: #5ef2e0;
  --glow-magenta: #ff5fb2;
  --amber: #ffc35a;
  --iron: #8a97a6;
  --outline: #1a1530;
  /* extras shared with core's materials palette */
  --cream: #f3e6c8;
  --ink: #120e22;
  --ochre: #c9892f;
  --cap-dark: #6e3f1a;
  --updraft: #8ef06a;
  /* UI-only derived tokens */
  --berry: #f04e78;                       /* hearts and hurt flash: between glow-magenta and horizon */
  --iron-light: #b9c6d4;                  /* anvil tonic ring, silver rank */
  --panel: color-mix(in srgb, var(--sky-top) 80%, transparent);
  --panel-deep: color-mix(in srgb, var(--outline) 88%, transparent);
  --panel-edge: color-mix(in srgb, var(--amber) 30%, transparent);
  --text: var(--cream);
  --text-dim: color-mix(in srgb, var(--cream) 72%, transparent);
  --shadow-ink: color-mix(in srgb, var(--ink) 60%, transparent);
  /* combo tiers (multiplier x1 .. x6) */
  --tier-1: var(--cream);
  --tier-2: var(--glow-cyan);
  --tier-3: var(--updraft);
  --tier-4: var(--amber);
  --tier-5: var(--glow-magenta);
  --tier-6: #fff4dc;
  /* type */
  --font-display: 'Bagel Fat One', 'Cooper Black', 'Arial Rounded MT Bold', 'Arial Black', ui-rounded, system-ui, sans-serif;
  --font-ui: 'Grandstander', 'Trebuchet MS', 'Verdana', ui-rounded, system-ui, sans-serif;
  /* layout */
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --pad: clamp(10px, 2.2vmin, 22px);
  --heart: clamp(24px, 5.6vmin, 38px);
  --score-size: clamp(30px, 7.6vmin, 56px);
  --radius: 18px;
}

html, body {
  margin: 0; height: 100%;
  background: var(--sky-top);
  color: var(--text);
  color-scheme: dark;
  overflow: hidden;
  overscroll-behavior: none;
}
body {
  font-family: var(--font-ui);
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
#app { position: fixed; inset: 0; touch-action: none; background: radial-gradient(120% 90% at 50% 100%, var(--horizon) 0%, var(--sky-mid) 30%, var(--sky-top) 70%); }
#app canvas { display: block; touch-action: none; outline: none; }

#ui {
  position: fixed; inset: 0; z-index: 10;
  pointer-events: none;
  font-family: var(--font-ui); font-weight: 700;
  color: var(--text);
  line-height: 1.25;
  contain: layout size style;
}
#ui * { box-sizing: border-box; }
#ui svg { display: block; overflow: visible; }
.ui-layer { position: absolute; inset: 0; pointer-events: none; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum' 1; }
.display { font-family: var(--font-display); font-weight: 400; font-synthesis: none; letter-spacing: .01em; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* outline-ish text for the HUD over a busy 3D scene */
.hud-text { text-shadow: 0 2px 0 var(--outline), 0 0 2px var(--outline), 0 0 10px var(--shadow-ink); }

/* ----------------------------------------------------------------- HUD */
.hud { transition: opacity .35s ease; }
.hud.is-hidden { opacity: 0; visibility: hidden; transition: opacity .25s ease, visibility 0s linear .25s; }
.hud-tl {
  position: absolute;
  left: calc(var(--safe-l) + var(--pad)); top: calc(var(--safe-t) + var(--pad));
  display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
}
.hud-tr {
  position: absolute;
  right: calc(var(--safe-r) + var(--pad)); top: calc(var(--safe-t) + var(--pad) - 4px);
  display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
  text-align: right;
}

/* hearts */
.hearts { display: flex; gap: clamp(1px, .5vmin, 4px); padding: 2px; }
.heart { width: var(--heart); height: calc(var(--heart) * .94); position: relative; transform-origin: 50% 70%; }
.heart svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 0 var(--outline)); }
.heart .hb { fill: var(--berry); stroke: var(--outline); stroke-width: 2.4; stroke-linejoin: round; transition: fill .25s; }
.heart .hv { fill: none; stroke: color-mix(in srgb, var(--cream) 50%, transparent); stroke-width: 1.3; stroke-linecap: round; transition: opacity .25s; }
.heart .hl { fill: color-mix(in srgb, white 55%, transparent); transition: opacity .25s; }
.heart .hs { fill: var(--moss); stroke: var(--outline); stroke-width: 2; stroke-linejoin: round; transition: fill .25s; }
.heart.is-empty .hb { fill: color-mix(in srgb, var(--ink) 62%, transparent); stroke: color-mix(in srgb, var(--cream) 42%, var(--outline)); }
.heart.is-empty .hv { opacity: .35; }
.heart.is-empty .hl { opacity: 0; }
.heart.is-empty .hs { fill: var(--moss-dark); }
.hearts.is-low .heart.is-last { animation: heartbeat 1.05s ease-in-out infinite; }
@keyframes heartbeat { 0%, 60%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(.98); } 42% { transform: scale(1.1); } }

/* counters */
.counters { display: flex; gap: 8px; flex-wrap: wrap; }
.cnt {
  display: inline-flex; align-items: center; gap: 6px;
  height: clamp(26px, 5.2vmin, 34px);
  padding: 0 12px 0 5px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--outline) 62%, transparent);
  border: 1.5px solid color-mix(in srgb, var(--cream) 14%, transparent);
  font-size: clamp(14px, 3.1vmin, 19px);
  transform-origin: 20% 50%;
}
.cnt .ic { width: clamp(20px, 4.2vmin, 26px); height: clamp(20px, 4.2vmin, 26px); flex: none; }
.cnt .of { color: var(--text-dim); font-size: .82em; }
.cnt.is-zero { opacity: .82; }
.ic-glowcap .c { fill: var(--glow-cyan); stroke: var(--outline); stroke-width: 1.8; stroke-linejoin: round; }
.ic-glowcap .f { fill: none; stroke: color-mix(in srgb, white 70%, transparent); stroke-width: 1.1; stroke-linecap: round; }
.ic-glowcap .s { fill: var(--cream); stroke: var(--outline); stroke-width: 1.8; stroke-linejoin: round; }
.ic-glowcap .g { fill: color-mix(in srgb, var(--glow-cyan) 35%, transparent); }
.ic-worm .seg { fill: var(--moss); stroke: var(--outline); stroke-width: 1.6; }
.ic-worm .tail { fill: var(--glow-cyan); stroke: var(--outline); stroke-width: 1.6; }
.ic-worm .halo { fill: color-mix(in srgb, var(--glow-cyan) 32%, transparent); }
.ic-worm .head { fill: var(--updraft); stroke: var(--outline); stroke-width: 1.6; }
.ic-worm .eye { fill: var(--outline); }
.ic-worm .ant { fill: none; stroke: var(--outline); stroke-width: 1.4; stroke-linecap: round; }
.ic-worm .bulb { fill: var(--glow-cyan); }

/* tonic ring */
.tonic {
  --tc: var(--amber);
  position: relative;
  width: clamp(50px, 10.5vmin, 66px); height: clamp(50px, 10.5vmin, 66px);
  transform-origin: 50% 50%;
  transition: opacity .3s, transform .3s cubic-bezier(.3, 1.6, .5, 1);
}
.tonic.is-hidden { opacity: 0; transform: scale(.4); visibility: hidden; transition: opacity .25s, transform .25s, visibility 0s linear .25s; }
.tonic[data-kind="anvil"] { --tc: var(--iron-light); }
.tonic[data-kind="updraft"] { --tc: var(--updraft); }
.tonic[data-kind="seeker"] { --tc: var(--glow-magenta); }
.tonic svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.tonic .ring-bg { fill: color-mix(in srgb, var(--outline) 78%, transparent); stroke: color-mix(in srgb, var(--cream) 14%, transparent); stroke-width: 6; }
.tonic .ring-fg { fill: none; stroke: var(--tc); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--tc)); }
.tonic .tonic-ic { position: absolute; inset: 22%; color: var(--tc); }
.tonic .tonic-ic svg { width: 100%; height: 100%; }
.tonic .tonic-ic .fill { fill: currentColor; stroke: var(--outline); stroke-width: 1.6; stroke-linejoin: round; }
.tonic .tonic-ic .line { fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.tonic .tonic-t { position: absolute; right: -6px; bottom: -4px; min-width: 24px; padding: 1px 5px; border-radius: 9px; background: var(--outline); color: var(--tc); font-size: 13px; text-align: center; border: 1.5px solid color-mix(in srgb, var(--tc) 50%, transparent); }
.tonic-name { position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: clamp(12px, 2.6vmin, 15px); color: var(--tc); letter-spacing: .04em; text-transform: uppercase; }
.tonic.is-warn { animation: tonic-blink .5s steps(2, jump-none) infinite; }
@keyframes tonic-blink { 0% { opacity: 1; } 100% { opacity: .3; } }

/* score + combo */
.score { font-size: var(--score-size); line-height: .95; color: var(--cream); letter-spacing: .02em;
  text-shadow: 0 3px 0 var(--outline), 0 0 3px var(--outline), 0 0 14px var(--shadow-ink); }
.score-label { font-size: clamp(10px, 2.2vmin, 13px); letter-spacing: .22em; text-transform: uppercase; color: var(--text-dim); margin-bottom: -2px; }
.combo { display: flex; align-items: center; gap: 8px; min-height: 30px; transition: opacity .3s, transform .3s; transform-origin: 100% 50%; }
.combo.is-off { opacity: 0; transform: translateY(-4px) scale(.96); }
.mult {
  --mc: var(--tier-1);
  font-size: clamp(20px, 4.6vmin, 30px); line-height: 1; padding: 3px 9px 4px; border-radius: 12px;
  color: var(--outline); background: var(--mc);
  box-shadow: 0 3px 0 var(--outline), 0 0 0 2px var(--outline), 0 0 16px color-mix(in srgb, var(--mc) 55%, transparent);
  transform: rotate(-4deg);
}
.mult[data-tier="1"] { --mc: var(--tier-1); box-shadow: 0 3px 0 var(--outline), 0 0 0 2px var(--outline); }
.mult[data-tier="2"] { --mc: var(--tier-2); }
.mult[data-tier="3"] { --mc: var(--tier-3); }
.mult[data-tier="4"] { --mc: var(--tier-4); }
.mult[data-tier="5"] { --mc: var(--tier-5); }
.mult[data-tier="6"] { --mc: var(--tier-6); background: linear-gradient(100deg, var(--glow-cyan), var(--tier-6) 35%, var(--amber) 65%, var(--glow-magenta)); }
.chainbox { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.chain { font-size: clamp(13px, 2.8vmin, 17px); color: var(--cream); }
.chain b { font-size: 1.2em; }
.bar { width: clamp(96px, 22vmin, 150px); height: 8px; border-radius: 6px; background: color-mix(in srgb, var(--outline) 80%, transparent); border: 1.5px solid var(--outline); overflow: hidden; box-shadow: 0 2px 0 var(--outline); }
.bar-fill { height: 100%; width: 100%; border-radius: 6px; transform-origin: 100% 50%; background: var(--mc, var(--cream)); }
.combo-end { font-size: clamp(12px, 2.6vmin, 15px); color: var(--amber); opacity: 0; transform: translateY(-4px); transition: opacity .3s, transform .3s; }
.combo-end.is-on { opacity: 1; transform: none; }

/* boss bar */
.hud-boss {
  position: absolute; left: 50%; top: calc(var(--safe-t) + var(--pad));
  width: min(440px, 46vw); transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: stretch; gap: 5px;
  transition: opacity .4s ease, transform .4s ease;
}
.hud-boss.is-hidden { opacity: 0; transform: translate(-50%, -14px); visibility: hidden; transition: opacity .5s ease .9s, transform .5s ease .9s, visibility 0s linear 1.4s; }
.boss-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.boss-name { display: flex; align-items: center; gap: 7px; font-size: clamp(16px, 3.6vmin, 23px); color: var(--cream); white-space: nowrap; }
.boss-name .ic { width: 1.35em; height: 1.35em; flex: none; }
.ic-pot .pot { fill: var(--iron); stroke: var(--outline); stroke-width: 1.8; stroke-linejoin: round; }
.ic-pot .rim { fill: var(--iron-light); stroke: var(--outline); stroke-width: 1.8; }
.ic-pot .face { fill: var(--moss); stroke: var(--outline); stroke-width: 1.8; }
.ic-pot .eye { fill: var(--amber); stroke: var(--outline); stroke-width: 1.2; }
.ic-pot .dent { fill: none; stroke: var(--outline); stroke-width: 1.2; stroke-linecap: round; }
.boss-pips { display: flex; gap: 5px; }
.boss-pips i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--outline); background: color-mix(in srgb, var(--cream) 22%, transparent); }
.boss-pips i.is-on { background: var(--glow-magenta); box-shadow: 0 0 8px var(--glow-magenta); }
.boss-pips i.is-done { background: var(--outline); border-color: color-mix(in srgb, var(--cream) 30%, transparent); }
.boss-bar { position: relative; height: clamp(14px, 3vmin, 18px); border-radius: 9px; background: color-mix(in srgb, var(--outline) 85%, transparent); border: 2px solid var(--outline); box-shadow: 0 3px 0 var(--outline), 0 0 0 1px color-mix(in srgb, var(--cream) 18%, transparent); overflow: hidden; }
.boss-trail, .boss-fill { position: absolute; inset: 0; transform-origin: 0 50%; }
.boss-trail { background: var(--cream); transition: transform .6s ease-in .35s; }
.boss-fill { background: linear-gradient(180deg, color-mix(in srgb, var(--glow-magenta) 70%, white) 0 30%, var(--glow-magenta) 31% 70%, color-mix(in srgb, var(--glow-magenta) 70%, var(--outline)) 71%); transition: transform .12s ease-out; }
.boss-notch { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1.5px; background: var(--outline); }

/* lock-on reticle / charge ring / score popups (projected from 3D) */
.reticle { position: absolute; left: 0; top: 0; width: 76px; height: 76px; margin: -38px 0 0 -38px; will-change: transform; color: var(--amber); }
.reticle.is-hidden, .charge.is-hidden { display: none; }
.reticle .spin { width: 100%; height: 100%; animation: reticle-spin 5s linear infinite; }
.reticle .r1 { fill: none; stroke: currentColor; stroke-width: 3; stroke-dasharray: 12 9; filter: drop-shadow(0 0 3px currentColor); }
.reticle .r0 { fill: none; stroke: var(--outline); stroke-width: 6; stroke-dasharray: 12 9; opacity: .65; }
.reticle .tip { fill: currentColor; stroke: var(--outline); stroke-width: 2; stroke-linejoin: round; }
.reticle .in { position: absolute; inset: 0; animation: reticle-in .28s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes reticle-spin { to { transform: rotate(360deg); } }
@keyframes reticle-in { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.charge { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; will-change: transform; --cc: var(--glow-cyan); }
.charge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.charge .cbg { fill: color-mix(in srgb, var(--outline) 55%, transparent); stroke: var(--outline); stroke-width: 7; }
.charge .cfg { fill: none; stroke: var(--cc); stroke-width: 4.5; stroke-linecap: round; }
.charge.is-full .cfg { filter: drop-shadow(0 0 4px var(--cc)); }
.charge.is-full svg { animation: charge-pulse .4s ease-in-out infinite alternate; }
.charge.at-reticle { width: 54px; height: 54px; margin: -27px 0 0 -27px; }
@keyframes charge-pulse { from { scale: 1; } to { scale: 1.12; } }

.pop {
  position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform, opacity;
  font-family: var(--font-display); font-weight: 400; font-size: clamp(18px, 4.2vmin, 26px);
  color: var(--pc, var(--cream)); --pc: var(--tier-1);
  text-shadow: 0 2px 0 var(--outline), 0 0 2px var(--outline), 0 0 12px color-mix(in srgb, var(--pc) 60%, transparent);
  display: none;
}
.pop .x { font-size: .78em; margin-left: .25em; color: var(--outline); background: var(--pc); padding: 0 .3em .05em; border-radius: .35em; text-shadow: none; box-shadow: 0 2px 0 var(--outline); vertical-align: .12em; }
.pop[data-tier="2"] { --pc: var(--tier-2); }
.pop[data-tier="3"] { --pc: var(--tier-3); }
.pop[data-tier="4"] { --pc: var(--tier-4); }
.pop[data-tier="5"] { --pc: var(--tier-5); }
.pop[data-tier="6"] { --pc: var(--tier-6); }

/* full-screen effects */
.vignette { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, transparent 42%, color-mix(in srgb, var(--berry) 55%, transparent) 82%, color-mix(in srgb, var(--berry) 85%, var(--outline)) 100%); }
.lowhp { position: absolute; inset: 0; opacity: 0; transition: opacity .6s; background: radial-gradient(ellipse at center, transparent 58%, color-mix(in srgb, var(--berry) 30%, transparent) 100%); }
.lowhp.is-on { opacity: 1; animation: lowhp 1.05s ease-in-out infinite; }
@keyframes lowhp { 0%, 100% { opacity: .55; } 20% { opacity: 1; } }

/* ----------------------------------------------------------------- cards */
.zonecard {
  position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; text-align: center;
  width: min(92vw, 720px); opacity: 0; visibility: hidden;
}
.zonecard.is-on { visibility: visible; animation: zc-card 2.7s ease both; }
#ui.boss-on .zonecard { top: 36%; }
@keyframes zc-card { 0% { opacity: 0; } 8%, 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -60%); } }
.zc-kicker { font-size: clamp(12px, 2.8vmin, 16px); letter-spacing: .3em; text-transform: uppercase; color: var(--amber); margin-bottom: 2px;
  text-shadow: 0 2px 0 var(--outline), 0 0 8px var(--shadow-ink); }
.zc-name { font-size: clamp(38px, 11vmin, 88px); line-height: 1.02; color: var(--cream); white-space: nowrap;
  text-shadow: 0 3px 0 var(--ochre), 0 6px 0 var(--outline), 0 0 3px var(--outline), 0 10px 26px var(--shadow-ink); }
.zc-name span { display: inline-block; white-space: pre; }
.zonecard.is-on .zc-name span { animation: zc-letter .6s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--i) * 32ms + 80ms); }
@keyframes zc-letter { from { opacity: 0; transform: translateY(.45em) rotate(var(--r, 4deg)) scale(.7); } to { opacity: 1; transform: rotate(var(--r2, 0deg)); } }
.zc-flourish { width: min(84vw, 460px); height: auto; margin-top: 4px; }
.zc-flourish .vine { fill: none; stroke: var(--amber); stroke-width: 2.4; stroke-linecap: round; filter: drop-shadow(0 2px 0 var(--outline)); }
.zc-flourish .leaf { fill: var(--moss); stroke: var(--outline); stroke-width: 1.4; }
.zc-flourish .bud { fill: var(--glow-cyan); stroke: var(--outline); stroke-width: 1.4; }
.zc-flourish .capg { fill: var(--amber); stroke: var(--outline); stroke-width: 1.6; }
.zc-flourish .pit { fill: var(--cap-dark); }
.zonecard.is-on .vine { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1s ease-out .35s forwards; }
.zonecard.is-on .leaf, .zonecard.is-on .bud, .zonecard.is-on .capgrp { animation: grow .5s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: .9s; transform-box: fill-box; transform-origin: center; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }

.toasts {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--safe-b) + clamp(18px, 9vh, 80px));
  width: min(92vw, 560px);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  max-width: 100%;
  padding: 10px 16px 11px 12px;
  border-radius: 16px;
  background: var(--panel-deep);
  border: 2px solid color-mix(in srgb, var(--amber) 34%, transparent);
  box-shadow: 0 4px 0 var(--outline), 0 10px 24px var(--shadow-ink);
  font-size: clamp(14px, 3.2vmin, 18px); font-weight: 700; line-height: 1.3;
  animation: toast-in .35s cubic-bezier(.2, 1.4, .4, 1) both;
}
.toast b { color: var(--amber); font-weight: 800; }
.toast .ic { width: 26px; height: 26px; flex: none; margin-top: -1px; }
.toast[data-kind="glowworm"] { border-color: color-mix(in srgb, var(--glow-cyan) 45%, transparent); }
.toast[data-kind="glowworm"] b { color: var(--glow-cyan); }
.toast.is-out { animation: toast-out .3s ease-in both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px) scale(.97); } }
.ic-sign .post { fill: var(--bark); stroke: var(--outline); stroke-width: 1.6; }
